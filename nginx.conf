server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  port_in_redirect off;
  error_page 404 /404.html;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /api/cms/manifest {
    add_header Cache-Control "no-store";
    try_files /cms/manifest.json =404;
  }

  location ~ ^/(cms|content)/.*\.json$ {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|webp|svg|ico|mp4|webmanifest)$ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location ~* (^|/)(?:Dockerfile|fly\.toml|nginx\.conf|package(?:-lock)?\.json|README\.md|CLAUDE\.md|BEM-STANDARDS\.md|PRODUCT\.md|DESIGN\.md|TROUBLESHOOTING\.md)$ {
    return 404;
  }

  location = /fo {
    return 302 /fo/;
  }

  location /fo/ {
    rewrite ^/fo/?$ /index.html last;
    rewrite ^/fo/(.*)$ /$1 last;
  }

  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }
}
